<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Procesador de Manhwa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   VARIABLES DINÁMICAS
========================= */

:root{
    --accent:#a855f7;
    --accent-soft:rgba(168,85,247,0.15);
}

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    height:100vh;
    color:#ddd;
    background:#0a0a0f;
    overflow:auto;
    position:relative;
}

#salida{
    max-height:100%;
    overflow-y:auto;
    padding:20px;
}

/* =========================
   FONDO IMAGEN REAL
========================= */

.background-img{
    position:fixed;
    inset:0;
    background-image:url("fondoShadow.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0.25;
    z-index:0;
    pointer-events:none;
}


.overlay-dark{
    position:fixed;
    inset:0;
    background:transparent;
    }
    z-index:1;
    pointer-events:none;
}

.container,
.glow-bar,
.panel-avanzado{
    position:relative;
    z-index:2;
}

/* =========================
   FRANJA LUMINOSA CENTRAL
========================= */

.glow-bar{
    position:absolute;
    top:120px;
    left:260px;
    right:0;
    height:3px;
    background:linear-gradient(to right, transparent, var(--accent), transparent);
    box-shadow:0 0 20px var(--accent);
    transition:0.4s;
}

.glow-bar.bottom{
    top:360px;
}

/* =========================
   LAYOUT
========================= */

.container{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:260px;
    padding:30px 20px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(14px);
    border-right:1px solid rgba(255,255,255,0.05);
}

.sidebar h3{
    margin-bottom:25px;
    color:var(--accent);
}

/* =========================
   BOTONES MENU
========================= */

.menu-btn{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.04);
    color:#ddd;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:0.3s;
}

.menu-btn i{
    transition:0.3s;
}

.menu-btn.active{
    border:1px solid var(--accent);
    background:var(--accent-soft);
    box-shadow:0 0 15px var(--accent);
}

.menu-btn.active i{
    color:var(--accent);
    text-shadow:0 0 15px var(--accent);
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    padding:40px;
    display:flex;
    flex-direction:column;
}

h1{
    color:var(--accent);
    margin-bottom:20px;
}

/* =========================
   CAJAS
========================= */

.box{
    flex:1;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:100%;
    resize:none;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
    color:#fff;
    backdrop-filter:blur(10px);
    transition:0.3s;
}

textarea:focus{
    outline:none;
    border:1px solid var(--accent);
}

/* =========================
   BOTONES CENTRALES
========================= */

.middle-bar{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:20px 0;
}

.btn{
    padding:14px 30px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.05);
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}

/* Procesar dinámico */
#btnProcesar{
    border:1px solid var(--accent);
}

#btnProcesar:hover{
    box-shadow:0 0 15px var(--accent);
}

/* Copiar siempre azul */
#btnCopiar{
    border:1px solid #3b82f6;
}

#btnCopiar:hover{
    box-shadow:0 0 15px #3b82f6;
}

/* Limpiar siempre rojo */
#btnLimpiar{
    border:1px solid #ef4444;
}

#btnLimpiar:hover{
    box-shadow:0 0 15px #ef4444;
}

/* Pegar siempre naranja */
#btnPegar{
    border:1px solid #f97316;
}

#btnPegar:hover{
    box-shadow:0 0 15px #f97316;
}

/* =========================
   MODO MOVIL
========================= */


body.modo-movil .main{
    padding:20px;
}

body.modo-movil .middle-bar{
    flex-direction:column;
    gap:15px;
}

body.modo-movil textarea{
    height:200px;
}

body.modo-movil .glow-bar{
    left:0;
}

/* ===== Zoom tipo teléfono ===== */

body.modo-movil{
    overflow-y:auto;
    touch-action:manipulation;
}

body.modo-movil .container{
    min-height:100vh;
}


/* Botones más táctiles */
body.modo-movil .btn{
    padding:18px 30px;
    font-size:16px;
}

/* Botones menú más cómodos */
body.modo-movil .menu-btn{
    padding:18px;
    font-size:15px;
}

/* Textarea más grande */
body.modo-movil textarea{
    height:260px;
    font-size:16px;
}

/* Bordes más tipo app */
body.modo-movil .btn,
body.modo-movil .menu-btn{
    border-radius:20px;
}

/* =========================
   SIDEBAR DESLIZABLE MOVIL
========================= */

.top-bar{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
}

/* En modo móvil */
body.modo-movil .menu-toggle{
    display:block;
}

body.modo-movil .sidebar.activo{
    left:0;
}

body.modo-movil .container{
    position:relative;
}

/* ===== Header móvil estilo app ===== */

.header-movil{
    display:none;
}

body.modo-movil .header-movil{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:15px;
}

body.modo-movil > .container .main > h1{
    display:none;
}

body.modo-movil .header-movil h1{
    font-size:20px;
    margin:0;
    white-space:nowrap;
}

/* ===== Sidebar tipo drawer ===== */

body.modo-movil .sidebar.activo{
    left:0;
}

body.modo-movil .middle-bar{
    flex-direction:column;
    align-items:center;
    gap:15px;
}

body.modo-movil .btn{
    width:70%;
    padding:14px;
}

/* =========================
   AJUSTE REAL APP MOVIL
========================= */

body.modo-movil{
    overflow-y:auto;
}

/* Sidebar más grande tipo app */

body.modo-movil .sidebar{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:#0d0d18;
    padding:30px 20px;
    transition:0.3s;
    z-index:998; /* menor que el botón */
}

/* =========================
   PANEL AVANZADO RESPONSIVE
========================= */

body.modo-movil .panel-avanzado{
    width:85%;
    max-width:380px;
 
    top:0;
    position:fixed;

    right:-90%;

    padding:20px;

    z-index:1000;

    border-left:2px solid var(--accent);

    box-shadow:-10px 0 25px rgba(0,0,0,0.45);

    background:rgba(10,10,20,0.72);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);
}

/* ===== PANEL CASI TRANSPARENTE ===== */

body.modo-movil .panel-avanzado.ver-fondo{
    background:rgba(10,10,20,0.12) !important;

    backdrop-filter:blur(3px);

    -webkit-backdrop-filter:blur(3px);

    border-left:2px solid rgba(255,255,255,0.15);
}

/* Inputs */
body.modo-movil .panel-avanzado.ver-fondo input[type="text"]{
    background:rgba(255,255,255,0.05) !important;
    border-color:rgba(255,255,255,0.08) !important;
    color:rgba(255,255,255,0.45) !important;
}

/* Labels */
body.modo-movil .panel-avanzado.ver-fondo label{
    color:rgba(255,255,255,0.45);
}

/* Títulos */
body.modo-movil .panel-avanzado.ver-fondo h3,
body.modo-movil .panel-avanzado.ver-fondo h4{
    color:rgba(255,255,255,0.45);
}

/* Líneas */
body.modo-movil .panel-avanzado.ver-fondo hr{
    opacity:0.15;
}

/* Botones */
body.modo-movil .panel-avanzado.ver-fondo .btn{
    opacity:0.25;
}

/* Checkbox */
body.modo-movil .panel-avanzado.ver-fondo input[type="checkbox"]{
    opacity:0.3;
}

/* Botón cerrar */
body.modo-movil .panel-avanzado.ver-fondo #cerrarPanelAvanzado{
    opacity:0.3;
}



body.modo-movil .panel-avanzado.activo{
    right:0;
}

/* Títulos */
body.modo-movil .panel-avanzado h3{
    font-size:24px;
}

body.modo-movil .panel-avanzado h4{
    font-size:20px;
    margin-top:20px;
}

/* Checkboxes */
body.modo-movil .panel-avanzado label{
    font-size:17px;
    margin-bottom:16px;
}

/* Inputs */
body.modo-movil .panel-avanzado input[type="text"]{
    font-size:17px;
    padding:14px;
    border-radius:12px;
}

/* Scroll más cómodo */
body.modo-movil .panel-avanzado{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

body.modo-movil #menuToggle{

    position:fixed;

    left:16px;
    top:20px;

    z-index:1000;

    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
    line-height:1;

    color:white;

    border-radius:50%;

    background:rgba(15,15,25,0.82);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.10);

    box-shadow:
        0 0 20px rgba(0,0,0,0.45),
        0 0 10px rgba(255,255,255,0.04);

    cursor:pointer;

    transition:
        transform 0.15s,
        background 0.25s;
}

body.modo-movil #menuToggle:active{
    transform:scale(0.92);
}

/* Hover / toque */
body.modo-movil #menuToggle:active{
    transform:scale(0.95);
}

body.modo-movil .sidebar.activo{
    left:0;
}

/* Texto sidebar más grande */
body.modo-movil .menu-btn{
    font-size:17px;
    padding:16px;
}

/* Header más grande */
body.modo-movil .header-movil h1{
    font-size:22px;
}

/* Ícono ☰ más grande */
body.modo-movil #menuToggle{
    font-size:26px;
}

/* Textarea más alto */
body.modo-movil textarea{
    height:350px;
    font-size:17px;
}

/* Botones tipo app */
body.modo-movil .btn{
    width:85%;
    font-size:17px;
    padding:16px;
}

/* Separación natural */
body.modo-movil .middle-bar{
    margin-top:25px;
}

/* =========================
   PANEL AVANZADO
========================= */

.panel-avanzado{
    position:fixed;
    right:-400px;
    top:0;
    width:350px;
    height:100%;
    background:#111827;
    padding:25px;
    transition:0.4s;
    z-index:999;
    overflow-y:auto;
    border-left:2px solid var(--accent);
}

.panel-avanzado.activo{
    right:0;
}

.panel-avanzado h3{
    margin-bottom:20px;
    color:var(--accent);
}

.panel-avanzado label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
}

.panel-avanzado input[type="text"]{
    width:100%;
    padding:8px;
    margin-bottom:12px;
    background:#1f2937;
    border:1px solid #333;
    color:#fff;
    border-radius:6px;
}

/* =========================
   BOTÓN MODO AVANZADO
========================= */

.boton-avanzado{
    width:100%;
    padding:14px;
    margin-top:20px;

    border-radius:14px;
    border:1px solid rgba(255,255,255,0.06);

    background:rgba(255,255,255,0.04);

    color:#ddd;
    cursor:pointer;

    transition:0.3s;

    font-size:15px;
    font-weight:600;
}

.boton-avanzado:hover{
    border:1px solid #cccccc;
    box-shadow:0 0 15px #cccccc;
    background:rgba(255,255,255,0.08);
}

@keyframes metalFlow{
    0%{ background-position:left; }
    100%{ background-position:right; }
}

body.avanzado-activo{
    --accent:#cccccc;
    --accent-soft:rgba(255,255,255,0.08);
}

body.avanzado-activo .glow-bar{
    background:linear-gradient(to right, transparent, #ffffff, transparent);
    box-shadow:0 0 20px #ffffff;
}

body.avanzado-activo h1{
    color:#e5e5e5;
}

/* ===================== */
/* BOTÓN MODO INTELIGENTE */
/* ===================== */

#btnModoInteligente{
    font-weight:bold;
}

/* OFF */
#btnModoInteligente.modo-off{
    border:1px solid #8b0000;
    background:rgba(139,0,0,0.15);
    color:white;
}

#btnModoInteligente.modo-off:hover{
    box-shadow:0 0 15px #8b0000;
}

/* ON */
#btnModoInteligente.modo-on{
    border:1px solid #0f7d32;
    background:rgba(15,125,50,0.15);
    color:white;
}

#btnModoInteligente.modo-on:hover{
    box-shadow:0 0 15px #0f7d32;
}

</style>

</head>

<body>

<div class="background-img"></div>
<div class="overlay-dark"></div>

<div class="glow-bar"></div>
<div class="glow-bar bottom"></div>

<div class="container">

<div class="sidebar">
<h3>FUENTES</h3>

<button class="menu-btn active" onclick="cambiarModo('hot','purple',this)">
<i class="fa-solid fa-fire"></i> Manhwas Hot
</button>


<button class="menu-btn" onclick="cambiarModo('normal','green',this)">
<i class="fa-solid fa-book-open"></i> Manhwas normales
</button>


<button class="menu-btn" onclick="cambiarModo('manga','blue',this)">
<i class="fa-solid fa-mask"></i> Mangas
</button>


<button class="menu-btn" onclick="cambiarModo('youtube','red',this)">
<i class="fa-brands fa-youtube"></i> YouTube
</button>

<button class="menu-btn" onclick="cambiarModo('intense','orange',this)">
<i class="fa-solid fa-comments"></i> IntenseDebate comentarios
</button>

<button id="btnAvanzado" class="menu-btn boton-avanzado">
⚙ Modo Avanzado
</button>

</div>

<div class="main">

<h1>Procesador de Manhwa</h1>

<div class="header-movil">
    <div id="menuToggle">
    ☰
   </div>
    <h1>Procesador de Manhwa</h1>
</div>

<button id="modoMovilBtn" class="btn" style="margin-bottom:15px;">
📱 Modo móvil
</button>

<div class="box">
<textarea id="entrada" placeholder="Pega aquí el texto..."></textarea>
</div>

<!-- ===============================
     CONTADORES ACUMULADOS
=============================== -->

<div id="contadores" style="margin-bottom:15px;">
  <div>🔥 Manhwas Hot: <span id="count-hot">0</span></div>
  <div>📘 Manhwas Normales: <span id="count-normal">0</span></div>
  <div>📕 Mangas: <span id="count-manga">0</span></div>
</div>

<button class="btn" id="btnGuardar" onclick="guardarActual()">
💾 Guardar actual
</button>

🧠 Modo inteligente OFF
</button>

<button class="btn" id="btnLimpiar" onclick="limpiar()">Limpiar</button>
<button class="btn" id="btnPegar" onclick="pegarDesdePortapapeles()">📋 Pegar

  <div id="guardados-manga"></div>

</div>

</div>

    color:white;
">
✕

">
🔄 Actualizar
</button>

<button id="btnVerFondo" class="btn" style="
    width:100%;

    position:sticky;
    bottom:0;
">
👁 Mantener para ver fondo
</button>

    <label><input type="checkbox" id="chkTitulo" checked> Mostrar Título</label>
    <label><input type="checkbox" id="chkSinopsis" checked> Mostrar Sinopsis</label>

<script>


let modoActual = "hot";

let origenInteligente = null; // "normal" | "manga"

let modoInteligenteActivo = false;

// ===============================
// LISTAS ACUMULATIVAS POR MODO
// ===============================
let listaManhwasHot = [];
let listaManhwasNormales = [];
let listaMangas = [];

let ultimoResultadoHTML = "";

document.getElementById("btnModoInteligente").onclick = function(){

    modoInteligenteActivo = !modoInteligenteActivo;

    if(modoInteligenteActivo){
        this.innerText = "🧠 Modo inteligente ON";
        this.classList.remove("modo-off");
        this.classList.add("modo-on");
    }else{
        this.innerText = "🧠 Modo inteligente OFF";
        this.classList.remove("modo-on");
        this.classList.add("modo-off");
    }
};

/* ===== PANEL AVANZADO ===== */

const btnAvanzado = document.getElementById("btnAvanzado");
const panelAvanzado = document.getElementById("panelAvanzado");

btnAvanzado.onclick = function(){

    panelAvanzado.classList.toggle("activo");

    document.body.classList.toggle("avanzado-activo");

};

/* ===== CERRAR PANEL AVANZADO MOVIL ===== */

const cerrarPanel = document.getElementById("cerrarPanelAvanzado");

cerrarPanel.onclick = function(){

    panelAvanzado.classList.remove("activo");

    document.body.classList.remove("avanzado-activo");

};

/* ===== ACTUALIZAR DESDE PANEL MOVIL ===== */

const btnActualizarMovil =
    document.getElementById("btnActualizarMovil");

btnActualizarMovil.onclick = function(){

    procesar();

};

/* ===== VER FONDO MIENTRAS SE MANTIENE ===== */

const btnVerFondo =
    document.getElementById("btnVerFondo");

btnVerFondo.addEventListener("touchstart", function(){

    panelAvanzado.classList.add("ver-fondo");

});

btnVerFondo.addEventListener("touchend", function(){

    panelAvanzado.classList.remove("ver-fondo");

});

/* PC también */
btnVerFondo.addEventListener("mousedown", function(){

    panelAvanzado.classList.add("ver-fondo");

});

btnVerFondo.addEventListener("mouseup", function(){

    panelAvanzado.classList.remove("ver-fondo");

});

/* ===== CAMBIO DE MODO + COLOR ===== */
function cambiarModo(modo, color, element){

    modoActual = modo;
    setTheme(color, element);

    const btnIntel = document.getElementById("btnModoInteligente");

    if(modo === "normal" || modo === "manga"){
        btnIntel.style.display = "inline-block";
    }else{
        btnIntel.style.display = "none";
        modoInteligenteActivo = false;
        btnIntel.innerText = "🧠 Modo inteligente OFF";
    }
}

/* ===== TEMA VISUAL ===== */
function setTheme(color, element){

    let root = document.documentElement;

    if(color==="purple"){
        root.style.setProperty('--accent','#a855f7');
        root.style.setProperty('--accent-soft','rgba(168,85,247,0.15)');
    }

    if(color==="green"){
        root.style.setProperty('--accent','#22c55e');
        root.style.setProperty('--accent-soft','rgba(34,197,94,0.15)');
    }

    if(color==="blue"){
        root.style.setProperty('--accent','#3b82f6');
        root.style.setProperty('--accent-soft','rgba(59,130,246,0.15)');
    }

);

if(inicioComentarios !== -1){
    let comentarioActual = "";

    let esperandoPrimerUsuario = true;
    let repliesPendientes = 0;
    let nivelBase = 1;
    let nivelReply = 3;

    let usuarioActual = ""; // ✅ usuario especial detectado

    for(let i = inicioComentarios + 1; i < lineas.length; i++){
        let raw = lineas[i];
        let linea = raw.trim();
        let lower = linea.toLowerCase();

        if(lower.startsWith("comentarios")) continue;

        let matchReply = lower.match(/(\d+)\s*repl(?:y|ies)/);
        if(matchReply){
            repliesPendientes = parseInt(matchReply[1]);
            nivelReply = 3;
            continue;
        }

        if(lower === "responder"){

        if(lower.match(/^\+\d+/)) continue;

        if(!leyendoComentario){
    if(esperandoPrimerUsuario){

            lower.startsWith("sesión iniciada") ||
            lower.startsWith("ordenar por") ||

        esperandoPrimerUsuario = false;
    }

    // ✅ Detectar si esta línea pertenece a un usuario especial

    let encontrado = usuariosVisibles.find(u =>
        lower.startsWith(u.toLowerCase())

    comentarioActual = "";
    leyendoComentario = true;

}

        comentarioActual += raw + "\n";

        let siguiente = (lineasLimpias[i + 1] || "").toLowerCase();
        if(siguiente === "responder" || siguiente.match(/^\+\d+/)){
            let nivelFinal = nivelBase;
            if(repliesPendientes > 0){
                nivelFinal = nivelReply;
                nivelReply += 2;
                repliesPendientes--;
            }
            comentarios.push({

           });

            usuarioActual = "";

            comentarioActual = "";
            leyendoComentario = false;

    });
}

                ) continue;

                esperandoPrimerUsuario = false;
            }
            comentarioActual = "";
            leyendoComentario = true;
            continue;
        }

        comentarioActual += raw + "\n";

        let siguiente = (lineasLimpias[i + 1] || "").toLowerCase();

        }
    }

    if(comentarioActual.trim() !== ""){
        comentarios.push({ texto: comentarioActual.trim(), nivel: nivelBase });
    }
}

function formatearMangaInteligente(){

    /* =========================*/

        .filter(l => l !== "");

    }

    /* =========================*/
    /* DETECTAR TITULO          */
    /* =========================*/

    // Asumimos que la primera línea larga es el título
    titulo = lineasFiltradas[0];

    // Si la primera línea es muy corta, buscar otra más sólida
    if(titulo.length < 3 && lineasFiltradas.length > 1){
        titulo = lineasFiltradas[1];
    }

    /* ========================= */
   /* DETECTAR ESTADO (ROBUSTO) */
 /* ========================= */

estado = "";

for(let i = 0; i < lineasFiltradas.length; i++){
    let lower = lineasFiltradas[i].toLowerCase();

    // formato: "Estado del título" -> siguiente línea
    if(lower.includes("estado")){

        if(siguiente.includes("emisión") || siguiente.includes("ongoing")){
            estado = "En emisión";

        if(
            siguiente.includes("finalizado") ||
            siguiente.includes("finished") ||
            siguiente.includes("complete")
        ){
            estado = "Finalizado";
        }
    }

    // formato directo en una línea
    if(
        lower.includes("en emisión") ||
        lower.includes("ongoing")
    ){
        estado = "En emisión";
    }

    if(
        lower.includes("finalizado") ||
        lower.includes("finished") ||
        lower.includes("complete")
    ){
        estado = "Finalizado";
    }
}


/* ================================ */
/* DETECTAR ESTADO Y CAPÍTULOS REAL */
/* ================================ */

estado = "";
totalCapitulos = "";

let posiblesCapitulos = [];
let detectaEnEmision = false;
let detectaFinalizado = false;

for(let i = 0; i < lineasFiltradas.length; i++){
    let l = lineasFiltradas[i];
    let lower = l.toLowerCase();


/* ✅ IGNORAR LÍNEAS DE COMENTARIOS */
    if (lower.includes("comentarios")) {
        continue; 
    }



    /* ----- ESTADO (MEJORADO SIN ROMPER) ----- */

    if(
        lower.includes("en emisión") ||
        lower.includes("en emision") ||
        lower.includes("ongoing") ||
        lower.includes("sigue en publicación") ||
        lower.includes("sigue en publicacion") ||
        lower.startsWith("estado: ongoing")
    ){
        detectaEnEmision = true;
    }

    if(
        lower.startsWith("estado: completed") ||
        lower.startsWith("estado: finalizado") ||
        lower.startsWith("status: completed") ||
        lower === "finalizado"
    ){
        detectaFinalizado = true;
    }

    /* ----- CAPÍTULOS EN MISMA LÍNEA ----- */
    let matchLinea = l.match(/(\d+)\s*(chapters|cap[ií]tulos)/i);
    if(matchLinea){
        posiblesCapitulos.push(parseInt(matchLinea[1],10));
    }

// ✅ detectar EPISODIOS como capítulos
let matchEpisodios = l.match(/(\d+)\s*episodios?/i);
if(matchEpisodios){
    posiblesCapitulos.push(parseInt(matchEpisodios[1],10));
}

    /* ----- CAPÍTULOS EN LÍNEA SIGUIENTE ----- */
    if(
        lower.startsWith("capítulos") ||
        lower.startsWith("capitulos") ||
        lower.startsWith("capítulos disponibles")
    ){

        if(/^\d+$/.test(siguiente)){
            posiblesCapitulos.push(parseInt(siguiente,10));
        }
    }

    /* ----- CAPÍTULOS POR LISTA (MEJORA CLAVE) ----- */
    let matchLista = l.match(/cap[ií]tulo\s*(\d+)/i);
    if(matchLista){
        posiblesCapitulos.push(parseInt(matchLista[1],10));
    }
}

/* ----- DECIDIR TOTAL DE CAPÍTULOS ----- */
if(posiblesCapitulos.length > 0){

}

/* ----- DECIDIR ESTADO FINAL (PRIORIDAD CORRECTA) ----- */
if(detectaEnEmision){

    /* ========================= */

sinopsis = "";

];

];

for(let i = 0; i < lineasFiltradas.length; i++){

}

// Si no hay etiqueta, usar Status / Genre
if(inicio === -1){

if(inicio !== -1){

        sinopsis += lineasFiltradas[i] + " ";
    }
}

sinopsis = sinopsis.trim();

/* ---------- 2️⃣ VALIDACIÓN (DETECTAR BASURA) ---------- */

let sinopsisInvalida =
    sinopsis === "" ||

/* ---------- 3️⃣ FALLBACK NARRATIVO CORREGIDO ---------- */

if (sinopsisInvalida) {

    for (let i = 0; i < lineasFiltradas.length; i++) {

if (

) {

}

        /* ===== IGNORAR METADATA ANTES DE EMPEZAR (MEJORADO) ===== */
         if (

       ) {

// ===== DETECTAR CONTENIDO NARRATIVO (FUERTE) =====
let esInicioNarrativo =
(

// ===== DETECTAR CONTENIDO NARRATIVO (SUAVE – FALLBACK) =====
let esNarrativaSuave =

// ===== CONTROL DE ARRANQUE (DOBLE CONFIRMACIÓN) =====

// ✅ 1) Arranque fuerte
if (!enNarrativa && esInicioNarrativo) {
    enNarrativa = true;
    sinopsis += l + " ";
}

// ✅ 2) Fallback suave si el fuerte no apareció
else if (!enNarrativa && esNarrativaSuave) {
    enNarrativa = true;

}

// ✅ 3) Continuación normal
else if (enNarrativa) {

}

}

}

function formatearYouTube(){
    const texto = document.getElementById("entrada").value;

    const lineas = texto
        .replace(/&nbsp;|&amp;nbsp;/g, " ")
        .split("\n")
        .map(l => l.trim())
        .filter(l => l !== "");

    const palabrasTiempo = [
        "segundo","segundos","minuto","minutos","hora","horas",
        "día","días","semana","semanas","mes","meses","año","años",
        "second","seconds","minute","minutes","hour","hours",
        "day","days","week","weeks","month","months","year","years",
        "ago","hace","editado"
    ];

    const esFecha = l =>
        palabrasTiempo.some(p => l.toLowerCase().includes(p));

    const esNumeroAislado = l => /^[0-9]+$/.test(l);

    // ===== 1. EXTRAER BLOQUES =====
    let bloques = [];
    let i = 0;

    while(i < lineas.length){

        // @usuario
        if(lineas[i].startsWith("@")) i++;

        // fecha
        if(i < lineas.length && esFecha(lineas[i])) i++;

        let textoComentario = [];

        while(
            i < lineas.length &&
            !esNumeroAislado(lineas[i]) &&
            lineas[i].toLowerCase() !== "responder"
        ){
            textoComentario.push(lineas[i]);
            i++;
        }

        // saltar likes + responder
        if(esNumeroAislado(lineas[i]) && lineas[i+1]?.toLowerCase() === "responder"){
            i += 2;
        }else if(lineas[i]?.toLowerCase() === "responder"){
            i++;
        }

        bloques.push(textoComentario.join(" "));
    }

    // ===== 2. CLASIFICAR BASE / RESPUESTAS =====
    let resultado = [];
    let idx = 0;

    while(idx < bloques.length){

        const base = bloques[idx];
        let respuestas = [];

        // mirar si MÁS ADELANTE hay "Ocultar respuestas"
        let hayOcultar = lineas.slice(idx).some(l => l.toLowerCase() === "ocultar respuestas");

        if(hayOcultar){
            let j = idx + 1;
            while(
                j < bloques.length &&
                lineas.slice(j).some(l => l.toLowerCase() !== "ocultar respuestas")
            ){
                respuestas.push(bloques[j]);
                j++;
            }
            idx = j + 1;
        }else{
            idx++;
        }

        resultado.push({ base, respuestas });
    }

    // ===== 3. FORMATO FINAL =====
    let salida = [];

    resultado.forEach(grupo => {
        salida.push("_ " + grupo.base);
        let nivel = 2;
        grupo.respuestas.forEach(r => {
            salida.push("_".repeat(nivel) + " " + r);
            nivel += 2;
        });
    });

    document.getElementById("salida").innerHTML =
        "<div><strong>Comentarios de YouTube:</strong></div><br>" +
        salida.join("<br><br>") +
        "<br><div>______________________________________</div>";
}

/* ======================= */
/* IntenseDebate */
/* ======================= */


function formatearIntenseDebate(){

let texto = document.getElementById("entrada").value;
let lineas = texto.split("\n");
let lineasLimpias = lineas.map(l => l.trim());

let comentarios = [];

/* ======================= */
/* EXTRAER COMENTARIOS */
/* ======================= */

let inicioComentarios = lineasLimpias.findIndex(l =>
    l.toLowerCase().startsWith("comentarios")
);

if(inicioComentarios !== -1){
    let comentarioActual = "";
    let leyendoComentario = false;
    let esperandoPrimerUsuario = true;
    let repliesPendientes = 0;
    let nivelBase = 1;
    let nivelReply = 3;

    for(let i = inicioComentarios + 1; i < lineas.length; i++){
        let raw = lineas[i];
        let linea = raw.trim();
        let lower = linea.toLowerCase();

        if(lower.startsWith("comentarios")) continue;

        let matchReply = lower.match(/(\d+)\s*repl(?:y|ies)/);
        if(matchReply){
            repliesPendientes = parseInt(matchReply[1]);
            nivelReply = 3;
            continue;
        }

        if(lower === "responder"){
            leyendoComentario = false;
            continue;
        }

        if(lower.match(/^\+\d+/)) continue;
        if(linea === "") continue;

        if(!leyendoComentario){
            if(esperandoPrimerUsuario){
                if(
                    lower.startsWith("ver todo") ||
                    lower.startsWith("tablero") ||
                    lower.startsWith("editar perfil") ||
                    lower.startsWith("cerrar sesión") ||
                    lower.startsWith("sesión iniciada") ||
                    lower.startsWith("ordenar por") ||
                    lower.match(/^\+\d+/)
                ) continue;

                esperandoPrimerUsuario = false;
            }
            comentarioActual = "";
            leyendoComentario = true;
            continue;
        }

        comentarioActual += raw + "\n";

        let siguiente = (lineasLimpias[i + 1] || "").toLowerCase();
        if(siguiente === "responder" || siguiente.match(/^\+\d+/)){
            let nivelFinal = nivelBase;
            if(repliesPendientes > 0){
                nivelFinal = nivelReply;
                nivelReply += 2;
                repliesPendientes--;
            }
            comentarios.push({ texto: comentarioActual.trim(), nivel: nivelFinal });
            comentarioActual = "";
            leyendoComentario = false;
        }
    }

    if(comentarioActual.trim() !== ""){
        comentarios.push({ texto: comentarioActual.trim(), nivel: nivelBase });
    }
}

/* ======================= */
/* FORMATEAR SOLO COMENTARIOS */
/* ======================= */

let comentariosFormateados = comentarios.map(c =>
    "_".repeat(c.nivel) + c.texto
);

/* 👇 SOLO ESTO 👇 */
document.getElementById("salida").innerHTML =
    comentariosFormateados.join("<br><br>");

}

function copiarListaGuardada(lista, nombre){

    if(lista.length === 0){
        alert("No hay guardados en " + nombre + ".");
        return;
    }

    let html = lista.join("<br><br>");

    copiarHTML(html, nombre + " copiados.");
}

async function copiarHTML(html, mensaje){

    // ✅ Asegura que los títulos mantengan tamaño al copiar
    html = html.replace(
        /font-size:\s*27px\s*;?\s*font-weight:\s*bold\s*;?/gi,
        "font-size:27px;font-weight:bold;"
    );

    // ✅ Convertir HTML a texto plano como respaldo
    const tempTexto = document.createElement("div");
    tempTexto.innerHTML = html;
    const textoPlano = tempTexto.innerText;

    try{
        // ✅ Copia como HTML real
        const blobHTML = new Blob([html], { type: "text/html" });
        const blobTexto = new Blob([textoPlano], { type: "text/plain" });

        await navigator.clipboard.write([
            new ClipboardItem({
                "text/html": blobHTML,
                "text/plain": blobTexto
            })
        ]);

        alert(mensaje);
    }catch(error){

        // ✅ Respaldo por si el navegador bloquea clipboard.write
        const temp = document.createElement("div");
        temp.innerHTML = html;

        temp.style.position = "fixed";
        temp.style.left = "-9999px";
        temp.style.top = "0";

        document.body.appendChild(temp);

        const range = document.createRange();
        range.selectNodeContents(temp);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        document.execCommand("copy");

        selection.removeAllRanges();
        document.body.removeChild(temp);

        alert(mensaje);
    }
}



</script>
